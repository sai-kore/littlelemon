<!DOCTYPE html>
<html>
<head>
    <title>Little Lemon</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 20px;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        a {
            padding: 10px 20px;
            background: #ffcc00;
            color: black;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        footer {
            padding: 15px;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<header>
    <h1>🍋 Little Lemon</h1>
</header>

<div class="content">
    <h2>Welcome to our restaurant</h2>
    <a href="/menu/">View Menu</a>
</div>

<footer>
    © 2026 Little Lemon
</footer>

</body>
</html>
